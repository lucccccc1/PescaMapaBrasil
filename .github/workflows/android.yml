name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'PescaMapaBrasil_Android_v1_0_1_Correcao_Mapa.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extrair projeto
        run: |
          unzip PescaMapaBrasil_Android_v1_0_1_Correcao_Mapa.zip -d projeto
          find projeto -name settings.gradle.kts

      - name: Compilar aplicativo
        run: |
          cd projeto
          gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: PescaMapaBrasil-APK
          path: projeto/**/build/outputs/apk/debug/*.apk