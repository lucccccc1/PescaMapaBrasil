
name: Gerar APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Investigar arquivo ZIP
        run: |
          echo "Arquivos no repositorio:"
          ls -lah
          echo "Procurando ZIP:"
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'PescaMapaBrasil_Android_v1_0_1_*_Mapa.zip' | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: ZIP nao encontrado"
            exit 1
          fi
          echo "ZIP encontrado: $ZIP_FILE"
          unzip -l "$ZIP_FILE" | head -60

      - name: Extrair projeto
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'PescaMapaBrasil_Android_v1_0_1_*_Mapa.zip' | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: ZIP nao encontrado"
            exit 1
          fi
          mkdir projeto
          unzip "$ZIP_FILE" -d projeto
          find projeto -type f \( -name settings.gradle.kts -o -name settings.gradle \)

      - name: Compilar aplicativo
        run: |
          find projeto -name build.gradle.kts -exec sed -i 's/JvmTarget.JVM_1_8/JvmTarget.JVM_17/g' {} +
          find projeto -name build.gradle.kts -exec sed -i -e 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' -e 's/JVM_1_8/JVM_17/g' -e 's/jvmTarget = "1.8"/jvmTarget = "17"/g' {} +
          GRADLE_FILE=$(find projeto -type f \( -name settings.gradle.kts -o -name settings.gradle \) | head -1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERRO: settings.gradle nao encontrado"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          cd "$PROJECT_DIR"
          printf '%s\n' \
            'gradle.projectsEvaluated {' \
            '    gradle.rootProject.allprojects.each { project ->' \
            '        project.tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {' \
            '            sourceCompatibility = "17"' \
            '            targetCompatibility = "17"' \
            '        }' \
            '    }' \
            '}' > "$GITHUB_WORKSPACE/force-java17.gradle"
          gradle -I "$GITHUB_WORKSPACE/force-java17.gradle" assembleDebug

      - name: Disponibilizar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PescaMapaBrasil-APK
          path: projeto/**/build/outputs/apk/debug/*.apk
